<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern calculator with keyboard support, calculation history, and dark mode.">
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="app">
        <header class="topbar">
            <div>
                <p class="eyebrow">EVERYDAY TOOL</p>
                <h1>Smart Calculator</h1>
            </div>

            <button id="theme-toggle" class="icon-button" aria-label="Switch theme">
                ☾
            </button>
        </header>

        <section class="calculator" aria-label="Calculator">

            <div class="display">
                <div id="expression" class="expression" aria-label="Expression"></div>
                <div id="result" class="result" aria-live="polite" aria-label="Result">0</div>
            </div>

            <div class="keypad">
                <button class="key key-function" data-action="clear">AC</button>
                <button class="key key-function" data-action="delete" aria-label="Delete last character">DEL</button>
                <button class="key key-function" data-action="percent">%</button>
                <button class="key key-operator" data-value="/">÷</button>

                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
                <button class="key key-operator" data-value="*">×</button>

                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
                <button class="key key-operator" data-value="-">−</button>

                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
                <button class="key key-operator" data-value="+">+</button>

                <button class="key key-function" data-action="sign">±</button>
                <button class="key" data-value="0">0</button>
                <button class="key" data-value=".">.</button>
                <button class="key key-equals" data-action="calculate">=</button>
            </div>

            <p class="keyboard-hint">Tip: You can also use your keyboard.</p>
        </section>

        <section class="history-section">
            <div class="history-heading">
                <h2>Recent Calculations</h2>
                <button id="clear-history" class="text-button">Clear history</button>
            </div>

            <div id="history-list" class="history-list">
                <p class="empty-history">Your calculations will appear here.</p>
            </div>
        </section>

        <footer class="footer">
            Built with HTML, CSS & JavaScript
        </footer>
    </main>

</body>
</html>
